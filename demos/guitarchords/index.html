<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuitarChords — Chord finder & fretboard trainer</title>
<meta name="description" content="Find any guitar chord, see the fingering, hear it, and discover chord progressions.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#f59e0b;--acc2:#ef4444;--bg:#0a0a0d;--panel:#111117;--panel2:#17171f;--line:#2a2a36;--ink:#f0f0f5;--mute:#888;--r:14px}
html,body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
/* nav */
.nav{display:flex;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-size:16px}
.nav-links{display:flex;gap:20px;font-size:13px;color:var(--mute);margin-left:12px}
.nav-links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-p{background:var(--acc);color:#0a0a0d;margin-left:auto}.btn-p:hover{opacity:.9}
/* layout */
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 61px)}
@media(max-width:700px){.app{grid-template-columns:1fr}}
/* sidebar */
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.search{position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 16px 11px 40px;color:var(--ink);font:inherit;font-size:14px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-bottom:4px}
.root-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.root-btn{padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;text-align:center;background:var(--panel2);border:1px solid transparent;transition:.15s;cursor:pointer}
.root-btn.active,.root-btn:hover{background:var(--acc);color:#0a0a0d;border-color:var(--acc)}
.type-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:300px}
.type-btn{padding:9px 12px;border-radius:9px;font-size:13px;text-align:left;background:var(--panel2);border:1px solid transparent;transition:.15s;cursor:pointer}
.type-btn.active,.type-btn:hover{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc)}
/* main content */
.main{padding:28px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:28px}
.chord-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chord-name{font-size:40px;font-weight:800;letter-spacing:-.03em}
.chord-full{font-size:16px;color:var(--mute)}
.play-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;background:var(--acc);color:#0a0a0d;font-weight:700;font-size:14px;border:0;cursor:pointer;transition:.15s;margin-left:auto}
.play-btn:hover{transform:scale(1.04)}
.play-btn svg{width:16px;height:16px;fill:currentColor}
/* fretboard */
.fretboard-wrap{background:var(--panel);border-radius:16px;border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:20px}
.fretboard{position:relative;user-select:none}
canvas#fret{display:block;width:100%;max-width:600px;margin:0 auto}
/* chord info */
.info-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.info-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.info-card .label{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.info-card .val{font-size:15px;font-weight:700}
.note-pills{display:flex;gap:6px;flex-wrap:wrap}
.note-pill{padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);font-size:13px;font-weight:600;border:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
/* progressions */
.prog-section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.prog-section h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--mute)}
.prog-list{display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent}
.prog-row:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.prog-name{font-size:13px;font-weight:700;min-width:120px}
.prog-chords{display:flex;gap:6px;flex-wrap:wrap}
.prog-chord{padding:4px 10px;border-radius:6px;background:var(--line);font-size:12px;font-weight:600}
.prog-mood{margin-left:auto;font-size:12px;color:var(--mute)}

@keyframes nj-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes nj-word{from{opacity:0;transform:translateY(70%) rotate(5deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes nj-pop{0%{transform:scale(.8);opacity:0;filter:blur(6px)}60%{transform:scale(1.06)}100%{transform:none;opacity:1;filter:none}}
.nj-a{opacity:0;animation:nj-up .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms + 100ms)}
.nj-w{display:inline-block;opacity:0;animation:nj-word .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.nj-pop{animation:nj-pop .55s cubic-bezier(.2,.7,.2,1)}
@media(prefers-reduced-motion:reduce){.nj-a,.nj-w{animation:none;opacity:1}.nj-pop{animation:none}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo"><i>🎸</i> GuitarChords</div>
  <div class="nav-links"><a href="#">Chords</a><a href="#">Scales</a><a href="#">Tuner</a></div>
  <button class="btn btn-p" onclick="playChord()">▶ Play chord</button>
</nav>

<div class="app">
  <aside class="sidebar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Search chords…" id="searchInput" oninput="filterChords(this.value)">
    </div>
    <div>
      <div class="section-label">Root note</div>
      <div class="root-grid" id="rootGrid"></div>
    </div>
    <div>
      <div class="section-label">Chord type</div>
      <div class="type-list" id="typeList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="chord-header">
      <div>
        <div class="chord-name" id="chordName">Am</div>
        <div class="chord-full" id="chordFull">A Minor</div>
      </div>
      <button class="play-btn" onclick="playChord()">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
        Play
      </button>
    </div>

    <div class="fretboard-wrap">
      <canvas id="fret" height="220"></canvas>
    </div>

    <div class="info-row" id="infoRow"></div>

    <div class="prog-section">
      <h3>Common progressions with <span id="progKey">Am</span></h3>
      <div class="prog-list" id="progList"></div>
    </div>
  </main>
</div>

<script>
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const TYPES = [
  {id:'',name:'Major',suffix:''},
  {id:'m',name:'Minor',suffix:'m'},
  {id:'7',name:'Dominant 7th',suffix:'7'},
  {id:'m7',name:'Minor 7th',suffix:'m7'},
  {id:'maj7',name:'Major 7th',suffix:'maj7'},
  {id:'sus2',name:'Suspended 2nd',suffix:'sus2'},
  {id:'sus4',name:'Suspended 4th',suffix:'sus4'},
  {id:'dim',name:'Diminished',suffix:'dim'},
  {id:'aug',name:'Augmented',suffix:'aug'},
  {id:'add9',name:'Add 9',suffix:'add9'},
  {id:'9',name:'9th',suffix:'9'},
  {id:'6',name:'6th',suffix:'6'},
];

// chord shapes: [string6..string1], -1=mute, 0=open, N=fret
const SHAPES = {
  'Am': [-1,0,2,2,1,0], 'A': [-1,0,2,2,2,0], 'A7': [-1,0,2,0,2,0], 'Am7': [-1,0,2,0,1,0],
  'Amaj7': [-1,0,2,1,2,0], 'Asus2': [-1,0,2,2,0,0], 'Asus4': [-1,0,2,2,3,0],
  'C': [-1,3,2,0,1,0], 'Cm': [-1,3,5,5,4,3], 'C7': [-1,3,2,3,1,0], 'Cm7': [-1,3,5,3,4,3],
  'Cmaj7': [-1,3,2,0,0,0], 'Csus2': [-1,3,0,0,1,3], 'Csus4': [-1,3,3,0,1,1],
  'D': [-1,-1,0,2,3,2], 'Dm': [-1,-1,0,2,3,1], 'D7': [-1,-1,0,2,1,2], 'Dm7': [-1,-1,0,2,1,1],
  'Dmaj7': [-1,-1,0,2,2,2], 'Dsus2': [-1,-1,0,2,3,0], 'Dsus4': [-1,-1,0,2,3,3],
  'E': [0,2,2,1,0,0], 'Em': [0,2,2,0,0,0], 'E7': [0,2,0,1,0,0], 'Em7': [0,2,2,0,3,0],
  'Emaj7': [0,2,1,1,0,0], 'Esus2': [0,2,2,4,0,0], 'Esus4': [0,2,2,2,0,0],
  'F': [1,3,3,2,1,1], 'Fm': [1,3,3,1,1,1], 'F7': [1,3,1,2,1,1], 'Fm7': [1,3,1,1,1,1],
  'Fmaj7': [-1,-1,3,2,1,0],
  'G': [3,2,0,0,0,3], 'Gm': [3,5,5,3,3,3], 'G7': [3,2,0,0,0,1], 'Gm7': [3,5,3,3,3,3],
  'Gmaj7': [3,2,0,0,0,2], 'Gsus2': [3,0,0,0,3,3], 'Gsus4': [3,3,0,0,1,3],
  'B': [-1,2,4,4,4,2], 'Bm': [-1,2,4,4,3,2], 'B7': [-1,2,1,2,0,2], 'Bm7': [-1,2,4,2,3,2],
  'Bmaj7': [-1,2,4,3,4,2],
};

const PROGRESSIONS = {
  'Am': [{name:'Classic Minor',chords:['Am','F','C','G'],mood:'Emotional'},{name:'Andalusian',chords:['Am','G','F','E'],mood:'Flamenco'},{name:'Natural Minor',chords:['Am','Dm','Em','Am'],mood:'Melancholic'}],
  'A': [{name:'Country Walk',chords:['A','D','E','A'],mood:'Country'},{name:'Rock Power',chords:['A','G','D','A'],mood:'Rock'},{name:'Classic I-IV-V',chords:['A','D','E','E'],mood:'Blues'}],
  'C': [{name:'I-V-vi-IV',chords:['C','G','Am','F'],mood:'Pop'},{name:'Classic Folk',chords:['C','F','G','C'],mood:'Folk'},{name:'50s Progression',chords:['C','Am','F','G'],mood:'Oldies'}],
  'D': [{name:'Power Ballad',chords:['D','A','Bm','G'],mood:'Ballad'},{name:'Country Road',chords:['D','G','A','D'],mood:'Country'},{name:'Rock Classic',chords:['D','C','G','D'],mood:'Rock'}],
  'E': [{name:'Blues in E',chords:['E','A','B','E'],mood:'Blues'},{name:'Minor Waltz',chords:['Em','C','G','D'],mood:'Folk'},{name:'Power Rock',chords:['E','D','A','E'],mood:'Hard Rock'}],
  'G': [{name:'Pop Anthem',chords:['G','D','Em','C'],mood:'Pop'},{name:'Country Classic',chords:['G','C','D','G'],mood:'Country'},{name:'Folk Waltz',chords:['G','Em','C','D'],mood:'Folk'}],
};

let currentRoot = 'A';
let currentType = 'm';

function getKey(){return currentRoot+currentType}

function getShape(){
  return SHAPES[getKey()] || SHAPES[currentRoot] || [-1,-1,-1,-1,-1,-1];
}

function getFullName(){
  const t = TYPES.find(t=>t.id===currentType);
  return currentRoot + ' ' + (t?t.name:'Major');
}

function getNotesInChord(){
  const root = NOTES.indexOf(currentRoot);
  const intervals = {'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'m7':[0,3,7,10],'maj7':[0,4,7,11],'sus2':[0,2,7],'sus4':[0,5,7],'dim':[0,3,6],'aug':[0,4,8],'add9':[0,4,7,14],'9':[0,4,7,10,14],'6':[0,4,7,9]};
  const ivls = intervals[currentType]||intervals[''];
  return ivls.map(i=>NOTES[(root+i)%12]);
}

function drawFretboard(){
  const canvas = document.getElementById('fret');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth||580;
  const H = 220;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const shape = getShape();
  const frets = shape.filter(f=>f>0);
  const minFret = frets.length?Math.min(...frets):1;
  const maxFret = frets.length?Math.max(...frets):4;
  const baseFret = minFret<=1?1:minFret-1;
  const numFrets = Math.max(4, maxFret-baseFret+2);

  const pad = {l:40,r:20,t:40,b:30};
  const fw = W - pad.l - pad.r;
  const fh = H - pad.t - pad.b;
  const stringSpacing = fw/5;
  const fretSpacing = fh/numFrets;

  ctx.clearRect(0,0,W,H);

  // nut
  if(baseFret===1){
    ctx.fillStyle='#c8a96e';
    ctx.fillRect(pad.l-2,pad.t-6,fw+4,8);
  }

  // fret lines
  for(let f=0;f<=numFrets;f++){
    const y = pad.t + f*fretSpacing;
    ctx.strokeStyle=f===0&&baseFret>1?'#444':'#333';
    ctx.lineWidth=f===0?2:1;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+fw,y); ctx.stroke();
  }

  // strings
  for(let s=0;s<6;s++){
    const x = pad.l + s*stringSpacing;
    ctx.strokeStyle='#666';
    ctx.lineWidth=1+(5-s)*0.3;
    ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+fh); ctx.stroke();
  }

  // fret numbers
  if(baseFret>1){
    ctx.fillStyle='#888';
    ctx.font='11px Inter, sans-serif';
    ctx.textAlign='right';
    for(let f=1;f<=numFrets;f++){
      ctx.fillText(baseFret+f-1, pad.l-6, pad.t + (f-.5)*fretSpacing+4);
    }
  }

  // string labels
  const STRING_NAMES=['E','A','D','G','B','e'];
  ctx.fillStyle='#666';
  ctx.font='11px Inter,sans-serif';
  ctx.textAlign='center';
  for(let s=0;s<6;s++){
    const x=pad.l+s*stringSpacing;
    ctx.fillText(STRING_NAMES[s], x, pad.t-14);
  }

  // dots
  const dotR = Math.min(stringSpacing,fretSpacing)*.35;
  for(let s=0;s<6;s++){
    const fret = shape[s];
    const x = pad.l + s*stringSpacing;
    if(fret===-1){
      // mute
      ctx.strokeStyle='#ef4444';
      ctx.lineWidth=2;
      const sz=8;
      const y=pad.t-14;
      ctx.beginPath(); ctx.moveTo(x-sz/2,y-sz/2); ctx.lineTo(x+sz/2,y+sz/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+sz/2,y-sz/2); ctx.lineTo(x-sz/2,y+sz/2); ctx.stroke();
    } else if(fret===0){
      // open
      ctx.strokeStyle='#f59e0b';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,pad.t-14,6,0,Math.PI*2); ctx.stroke();
    } else {
      // fretted
      const relFret = fret - baseFret + 1;
      const y = pad.t + (relFret-.5)*fretSpacing;
      const grad = ctx.createRadialGradient(x-dotR*.3,y-dotR*.3,dotR*.1,x,y,dotR);
      grad.addColorStop(0,'#f59e0b');
      grad.addColorStop(1,'#d97706');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(x,y,dotR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0a0a0d';
      ctx.font='bold 11px Inter,sans-serif';
      ctx.textAlign='center';
      ctx.fillText(fret,x,y+4);
    }
  }
}

function renderInfo(){
  const notes = getNotesInChord();
  const fingers = getShape().filter(f=>f>0).join(' · ');
  document.getElementById('infoRow').innerHTML = `
    <div class="info-card">
      <div class="label">Notes</div>
      <div class="note-pills">${notes.map(n=>`<span class="note-pill">${n}</span>`).join('')}</div>
    </div>
    <div class="info-card">
      <div class="label">Difficulty</div>
      <div class="val">${['dim','aug','m7','maj7','add9'].includes(currentType)?'Advanced':currentType===''||currentType==='m'?'Beginner':'Intermediate'}</div>
    </div>
    <div class="info-card">
      <div class="label">Fret positions</div>
      <div class="val" style="font-size:13px;letter-spacing:.05em">${fingers||'Open'}</div>
    </div>
    <div class="info-card">
      <div class="label">Interval</div>
      <div class="val" style="font-size:13px">${currentType===''?'1 - 3 - 5':currentType==='m'?'1 - b3 - 5':currentType==='7'?'1 - 3 - 5 - b7':currentType==='m7'?'1 - b3 - 5 - b7':'1 - 3 - 5 - …'}</div>
    </div>`;
}

function renderProgressions(){
  const key = currentRoot;
  const progs = PROGRESSIONS[key]||PROGRESSIONS['G'];
  document.getElementById('progKey').textContent = getKey();
  document.getElementById('progList').innerHTML = progs.map(p=>`
    <div class="prog-row">
      <span class="prog-name">${p.name}</span>
      <div class="prog-chords">${p.chords.map(c=>`<span class="prog-chord">${c}</span>`).join('')}</div>
      <span class="prog-mood">${p.mood}</span>
    </div>`).join('');
}

function update(){
  document.getElementById('chordName').textContent = getKey();
  document.getElementById('chordFull').textContent = getFullName();
  drawFretboard();
  renderInfo();
  renderProgressions();
}

function playChord(){
  if(!window.AudioContext&&!window.webkitAudioContext) return;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const shape = getShape();
  const BASE_FREQS = [82.41,110,146.83,196,246.94,329.63];
  const semitones = shape.map((fret,i)=>fret===-1?null:BASE_FREQS[i]*Math.pow(2,fret/12));
  semitones.forEach((freq,i)=>{
    if(!freq) return;
    setTimeout(()=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type='triangle';
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime);
      gain.gain.linearRampToValueAtTime(.18,ctx.currentTime+.01);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime+1.5);
    },i*40);
  });
}

// build sidebar
document.getElementById('rootGrid').innerHTML = NOTES.map(n=>`
  <button class="root-btn${n===currentRoot?' active':''}" onclick="selectRoot('${n}')">${n}</button>`).join('');

document.getElementById('typeList').innerHTML = TYPES.map(t=>`
  <button class="type-btn${t.id===currentType?' active':''}" onclick="selectType('${t.id}')">${t.name}</button>`).join('');

function selectRoot(r){
  currentRoot=r;
  document.querySelectorAll('.root-btn').forEach((b,i)=>b.classList.toggle('active',NOTES[i]===r));
  update();
}
function selectType(t){
  currentType=t;
  document.querySelectorAll('.type-btn').forEach((b,i)=>b.classList.toggle('active',TYPES[i].id===t));
  update();
}
function filterChords(q){
  if(!q){document.querySelectorAll('.type-btn').forEach(b=>b.style.display='');return;}
  q=q.toUpperCase();
  document.querySelectorAll('.type-btn').forEach((b,i)=>{
    b.style.display=TYPES[i].name.toUpperCase().includes(q)||TYPES[i].id.toUpperCase().includes(q)?'':'none';
  });
}

window.addEventListener('resize',()=>{drawFretboard()});
update();
</script>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var q=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var rise=function(els,base){els.forEach(function(e,i){if(e.nodeType!==1||e.classList.contains('nj-a'))return;e.style.setProperty('--i',i+(base||0));e.classList.add('nj-a')})};
  var split=function(el){if(!el||el.dataset.sp)return;el.dataset.sp=1;el.innerHTML=el.textContent.trim().split(/\s+/).map(function(w,i){return '<span class="nj-w" style="--i:'+i+'">'+w+'</span>'}).join(' ')};
  rise(q('.nav,.sidebar>*,.chord-header,.fretboard-wrap,.prog-section'));
