<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hue Lab — Colour Palette Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;background:#fafafa;color:#141414;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #e8e8e8;background:#fff;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;flex:1;display:flex;gap:8px;align-items:center}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(#ff5f6d,#ffc371,#47e891,#2fa9ff,#a259ff,#ff5f6d)}
.seg{display:flex;background:#f1f1f1;border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#666}
.seg button.on{background:#fff;color:#141414;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid #e3e3e3;background:#fff}
.btn.dark{background:#141414;color:#fff;border-color:#141414}
.pal{flex:1;display:flex;min-height:420px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px 8px;gap:10px;transition:flex .3s,background-color .5s;position:relative}
.col:hover{flex:1.25}
.hex{font-family:'JetBrains Mono';font-size:22px;font-weight:500;letter-spacing:.02em;cursor:pointer}
.nm{font-size:13px;opacity:.75}
.tools{display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .2s;margin-bottom:auto;margin-top:20%}
.col:hover .tools,.col .tools .on{opacity:1}
.col:hover .tools{opacity:1}
.tools button{width:40px;height:40px;border-radius:10px;font-size:17px;display:grid;place-items:center}
.tools button:hover{background:rgba(127,127,127,.18)}
.lock.on{opacity:1!important}
.col .lk{position:absolute;top:16px;font-size:16px}
.bottom{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;padding:20px;background:#fff;border-top:1px solid #e8e8e8}
.box{border:1px solid #ececec;border-radius:16px;padding:16px}
.box h4{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:12px}
.mock{border-radius:12px;overflow:hidden;font-size:13px}
.mock .nav{padding:10px 14px;display:flex;justify-content:space-between;font-weight:700}
.mock .body{padding:18px 14px;display:grid;gap:8px}
.mock .cta{padding:8px 12px;border-radius:8px;font-weight:700;justify-self:start}
.pairs{display:grid;gap:6px;font-size:13px}
.pair{display:flex;align-items:center;gap:10px}
.pair span.s{width:64px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700}
.pair b{margin-left:auto;font-family:'JetBrains Mono';font-size:12px}
.ok{color:#169c4d}.no{color:#d33}
.saved{display:grid;gap:8px;max-height:180px;overflow:auto}
.saved button{display:flex;height:30px;border-radius:8px;overflow:hidden;width:100%}
.saved span{flex:1}
pre{font-family:'JetBrains Mono';font-size:12px;background:#f5f5f5;padding:10px;border-radius:10px;overflow:auto;margin-top:8px}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-140px);background:#141414;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:transform .3s;z-index:20}
.toast.show{transform:translate(-50%,0)}
.back{position:fixed;left:16px;bottom:16px;z-index:40;background:#111;color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;text-decoration:none}
@media(max-width:860px){.pal{flex-direction:column;min-height:auto}.col{flex-direction:row;padding:16px;justify-content:space-between}.tools{flex-direction:row;margin:0;opacity:1}.bottom{grid-template-columns:1fr}.hex{font-size:16px}}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:7px;transition:background .2s,border-color .2s,transform .15s}.btn:hover{border-color:#cfcfcf}.btn:active{transform:scale(.97)}
.btn.active{background:#141414;color:#fff;border-color:#141414}
.btn.dark kbd{font-family:inherit}
.tools button .ic{width:19px;height:19px}
.col .lk .ic{width:16px;height:16px}
.stage{flex:1;display:flex;min-height:420px}
.stage .pal{flex:1}
.photo{width:0;overflow:hidden;background:#111;color:#fff;display:flex;flex-direction:column;transition:width .5s cubic-bezier(.2,.7,.2,1);flex:none}
.stage.with-photo .photo{width:min(42vw,560px)}
.ph-main{position:relative;flex:1;min-height:240px;overflow:hidden;margin:14px 14px 0;border-radius:14px;background:#222}
.ph-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#marks{position:absolute;inset:0}
#marks span{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.45);transform:translate(-50%,-50%);animation:pin .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pin{from{transform:translate(-50%,-50%) scale(0)}}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0,rgba(255,255,255,.35) 50%,transparent 51%);background-size:100% 220%;opacity:0}
.scan.run{animation:scan .8s ease-out}
@keyframes scan{0%{opacity:1;background-position:0 100%}100%{opacity:0;background-position:0 -20%}}
.ph-bar{display:flex;gap:8px;padding:12px 14px 0;align-items:center}
.ph-thumbs{display:flex;gap:8px}
.ph-thumbs button{width:56px;height:56px;border-radius:10px;overflow:hidden;opacity:.55;transition:opacity .2s,box-shadow .2s;flex:none}
.ph-thumbs button.on,.ph-thumbs button:hover{opacity:1}.ph-thumbs button.on{box-shadow:0 0 0 2px #fff}
.ph-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.up{margin-left:auto;height:56px;padding:0 14px;border-radius:10px;border:1px dashed rgba(255,255,255,.35);display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;transition:background .2s}.up:hover{background:rgba(255,255,255,.08)}
.ph-note{font-size:12px;opacity:.6;padding:10px 14px 14px;font-family:'JetBrains Mono'}
@media(max-width:860px){header .btn span,header kbd,.col .lk{display:none}header{gap:8px}.stage{flex-direction:column}.stage.with-photo .photo{width:100%}.photo{width:100%;max-height:0;transition:max-height .5s}.stage.with-photo .photo{max-height:560px}.ph-main{min-height:220px;flex:none;height:240px}.seg{order:5;width:100%;overflow-x:auto}.seg button{flex:1;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10C19.5 15.6 12 20 12 20z"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M14 14l6 6M4 4l5 5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>
<header>
  <div class="logo"><i></i>Hue Lab</div>
  <div class="seg" id="mode"><button data-m="analogous" class="on">Analogous</button><button data-m="complementary">Complementary</button><button data-m="triadic">Triadic</button><button data-m="mono">Mono</button></div>
  <button class="btn" id="photoBtn" aria-pressed="false"><svg class="ic"><use href="#i-image"/></svg><span>From photo</span></button><button class="btn" id="save"><svg class="ic"><use href="#i-heart"/></svg><span>Save</span></button><button class="btn" id="exp"><svg class="ic"><use href="#i-code"/></svg><span>Export CSS</span></button><button class="btn dark" id="gen"><svg class="ic"><use href="#i-shuffle"/></svg>Generate <kbd style="opacity:.6;font-size:11px">space</kbd></button>
</header>
<div class="stage" id="stage">
  <section class="photo" id="photoPane" aria-label="Extract palette from photo">
    <div class="ph-main"><img id="phImg" alt="Source photo" crossorigin="anonymous"><div id="marks"></div><div class="scan" id="scan"></div></div>
    <div class="ph-bar"><div class="ph-thumbs" id="phThumbs"></div><label class="up" title="Upload your own photo"><svg class="ic"><use href="#i-upload"/></svg><span>Upload</span><input type="file" id="phFile" accept="image/*" hidden></label></div>
    <p class="ph-note" id="phNote">K-means clustering on 14,000 sampled pixels.</p>
  </section>
  <div class="pal" id="pal"></div>
</div>
<div class="bottom">
  <div class="box"><h4>Live UI preview</h4><div class="mock" id="mock"></div></div>
  <div class="box"><h4>Contrast (WCAG)</h4><div class="pairs" id="pairs"></div></div>
  <div class="box"><h4>Saved palettes</h4><div class="saved" id="saved"></div><pre id="code" hidden></pre></div>
</div>
<div class="toast" id="toast"></div>
<a class="back" href="../../index.html#work">← Back to portfolio</a>
<script>
const $=s=>document.querySelector(s);
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return (x+.05)/(y+.05)};
const NAMES=[[0,'Red'],[18,'Vermilion'],[30,'Orange'],[45,'Amber'],[55,'Yellow'],[75,'Lime'],[110,'Green'],[150,'Jade'],[175,'Teal'],[195,'Cyan'],[210,'Sky'],[228,'Blue'],[250,'Indigo'],[275,'Violet'],[295,'Purple'],[320,'Magenta'],[340,'Rose'],[360,'Red']];
function name(h,s,l){if(s<12)return l>85?'Snow':l<18?'Ink':'Slate';const n=NAMES.reduce((a,b)=>Math.abs(b[0]-h)<Math.abs(a[0]-h)?b:a)[1];return (l>75?'Pale ':l<30?'Deep ':'')+n}
let mode='analogous',cols=[];
function gen(){const base=Math.random()*360,sat=45+Math.random()*40;
 const offs={analogous:[-40,-20,0,20,40],complementary:[0,10,180,190,0],triadic:[0,120,240,0,120],mono:[0,0,0,0,0]}[mode];
 const lights=mode=='mono'?[92,75,55,35,16]:[90,70,55,38,18].sort(()=>Math.random()-.5);
 cols=offs.map((o,i)=>{if(cols[i]?.lock)return cols[i];const h=(base+o+360)%360,s=mode=='mono'?sat:Math.max(20,sat+(Math.random()*20-10)),l=lights[i];return{h,s,l,hex:hsl2hex(h,s,l),lock:false}});
 if(mode!='mono')cols.sort((a,b)=>a.lock||b.lock?0:b.l-a.l);draw()}
function draw(){
 $('#pal').innerHTML=cols.map((c,i)=>{const fg=lum(c.hex)>.4?'#141414':'#fff';return `<div class="col" style="background:${c.hex};color:${fg}">${c.lock?'<span class="lk"><svg class="ic"><use href="#i-lock"/></svg></span>':''}<div class="tools"><button class="lock ${c.lock?'on':''}" data-a="lock" data-i="${i}" title="${c.lock?'Unlock':'Lock'} colour" aria-label="${c.lock?'Unlock':'Lock'} colour">${c.lock?'<svg class="ic"><use href="#i-lock"/></svg>':'<svg class="ic"><use href="#i-unlock"/></svg>'}</button><button data-a="copy" data-i="${i}" title="Copy hex" aria-label="Copy hex"><svg class="ic"><use href="#i-copy"/></svg></button><button data-a="left" data-i="${i}" title="Move left" aria-label="Move left"><svg class="ic"><use href="#i-left"/></svg></button></div><div class="hex" data-a="copy" data-i="${i}">${c.hex.slice(1).toUpperCase()}</div><div class="nm">${name(c.h,c.s,c.l)}</div></div>`}).join('');
 const s=[...cols].sort((a,b)=>b.l-a.l),[bg,soft,mid,acc,ink]=s.map(c=>c.hex);
 $('#mock').innerHTML=`<div style="background:${bg};color:${ink}"><div class="nav" style="background:${ink};color:${bg}"><span style="display:inline-flex;align-items:center;gap:6px"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" transform="rotate(45 6 6)" fill="currentColor"/></svg>Studio</span><span style="font-weight:400;opacity:.8">Work · About</span></div><div class="body"><b style="font-size:20px">Design that feels right.</b><span style="opacity:.75">Your palette applied to a real interface.</span><div style="display:flex;gap:6px"><span class="cta" style="background:${acc};color:${lum(acc)>.4?ink:bg}">Get started</span><span class="cta" style="background:${soft};color:${ink}">Learn more</span></div><div style="display:flex;gap:6px">${[soft,mid,acc].map(c=>`<span style="flex:1;height:30px;border-radius:6px;background:${c}"></span>`).join('')}</div></div></div>`;
 const pairs=[[ink,bg],[acc,bg],[ink,soft],[bg,mid],[bg,acc]];
 $('#pairs').innerHTML=pairs.map(([f,b])=>{const r=contrast(f,b);return `<div class="pair"><span class="s" style="background:${b};color:${f}">Aa</span><span>${r>=7?'AAA':r>=4.5?'AA':r>=3?'AA Large':'Fail'}</span><b class="${r>=4.5?'ok':'no'}">${r.toFixed(2)}:1</b></div>`}).join('');
 drawSaved();
}
const saved=()=>{try{return JSON.parse(localStorage.getItem('hl-saved')||'[]')}catch(e){return[]}};
function drawSaved(){const l=saved();$('#saved').innerHTML=l.length?l.map((p,i)=>`<button data-load="${i}" title="Load palette">${p.map(c=>`<span style="background:${c}"></span>`).join('')}</button>`).join(''):'<p style="color:#999;font-size:13px">Press Save to keep palettes here.</p>'}
$('#saved').onclick=e=>{const b=e.target.closest('[data-load]');if(!b)return;cols=saved()[b.dataset.load].map(hex=>fromHex(hex));draw();toast('Palette loaded')};
$('#pal').onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const i=+t.dataset.i;
 if(t.dataset.a=='lock'){cols[i].lock=!cols[i].lock;draw()}
 if(t.dataset.a=='copy'){navigator.clipboard?.writeText(cols[i].hex);toast('Copied '+cols[i].hex.toUpperCase())}
 if(t.dataset.a=='left'&&i>0){[cols[i-1],cols[i]]=[cols[i],cols[i-1]];draw()}};
$('#mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('#mode').children].forEach(x=>x.classList.toggle('on',x==b));gen()};
$('#gen').onclick=gen;
$('#save').onclick=()=>{const l=saved();l.unshift(cols.map(c=>c.hex));try{localStorage.setItem('hl-saved',JSON.stringify(l.slice(0,12)))}catch(e){}drawSaved();toast('Palette saved')};
$('#exp').onclick=()=>{const css=':root {\n'+cols.map((c,i)=>`  --color-${i+1}: ${c.hex}; /* ${name(c.h,c.s,c.l)} */`).join('\n')+'\n}';const p=$('#code');p.hidden=false;p.textContent=css;navigator.clipboard?.writeText(css);toast('CSS variables copied')};
addEventListener('keydown',e=>{if(e.code=='Space'&&e.target==document.body){e.preventDefault();gen()}});
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1600)}

function fromHex(hex){const [r,g,bb]=hex2rgb(hex).map(v=>v/255),mx=Math.max(r,g,bb),mn=Math.min(r,g,bb),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-bb)/d)%6:mx==g?(bb-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return{h,s:s*100,l:l*100,hex,lock:false}}
const PHOTOS=[['bali-kelingking','Kelingking, Bali'],['cafe-hero-poster','Curry spread'],['everest-trek','Everest trail'],['kathmandu-puppets','Kathmandu puppets']];
let photoOn=false,curPhoto=null;
$('#phThumbs').innerHTML=PHOTOS.map(([f,t])=>`<button data-ph="${f}" title="${t}" aria-label="Use photo: ${t}"><img src="../../media/img/${f}.jpg" alt=""></button>`).join('');
function setPhotoMode(on){photoOn=on;$('#stage').classList.toggle('with-photo',on);$('#photoBtn').classList.toggle('active',on);$('#photoBtn').setAttribute('aria-pressed',on);if(on&&!curPhoto)loadPhoto('../../media/img/'+PHOTOS[0][0]+'.jpg',PHOTOS[0][0])}
$('#photoBtn').onclick=()=>setPhotoMode(!photoOn);
$('#phThumbs').onclick=e=>{const b=e.target.closest('[data-ph]');if(b)loadPhoto('../../media/img/'+b.dataset.ph+'.jpg',b.dataset.ph)};
$('#phFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Choose an image file (JPG, PNG or WebP)');return}const r=new FileReader();r.onload=()=>loadPhoto(r.result,'upload');r.readAsDataURL(f)};
function loadPhoto(src,key){curPhoto=key;const im=$('#phImg');$('#phThumbs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.ph==key));
 $('#marks').innerHTML='';$('#scan').classList.remove('run');void $('#scan').offsetWidth;$('#scan').classList.add('run');
 im.onload=()=>setTimeout(()=>extract(im),matchMedia('(prefers-reduced-motion: reduce)').matches?0:450);
 im.onerror=()=>toast('That photo could not be read. Try another one.');im.src=src}
function extract(im){const W=140,H=Math.max(1,Math.round(W*im.naturalHeight/im.naturalWidth)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,W,H);
 let d;try{d=x.getImageData(0,0,W,H).data}catch(e){toast('That photo could not be read. Try another one.');return}
 const px=[];for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;px.push([d[i],d[i+1],d[i+2],(i/4)%W,Math.floor(i/4/W)])}
 const K=5,dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
 // k-means++ init with seeded RNG for stable results
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const C=[px[Math.floor(rnd()*px.length)].slice(0,3)];
 while(C.length<K){const ds=px.map(p=>Math.min(...C.map(c=>dist(p,c))));const tot=ds.reduce((a,b)=>a+b,0);let r=rnd()*tot,i=0;while(r>ds[i]&&i<ds.length-1){r-=ds[i];i++}C.push(px[i].slice(0,3))}
 let as=new Array(px.length).fill(0);
 for(let it=0;it<14;it++){const S=C.map(()=>[0,0,0,0]);px.forEach((p,i)=>{let b=0,bd=1e9;for(let k=0;k<K;k++){const dd=dist(p,C[k]);if(dd<bd){bd=dd;b=k}}as[i]=b;const s=S[b];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++});
  let moved=0;S.forEach((s,k)=>{if(!s[3])return;const n=[s[0]/s[3],s[1]/s[3],s[2]/s[3]];moved+=dist(n,C[k]);C[k]=n});if(moved<1)break}
 const cnt=C.map((_,k)=>as.filter(a=>a==k).length);
 const near=C.map((c,k)=>{let best=null,bd=1e9;px.forEach((p,i)=>{if(as[i]!=k)return;const dd=dist(p,c);if(dd<bd){bd=dd;best=p}});return best});
 const out=C.map((c,k)=>({hex:'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''),n:cnt[k],at:near[k]})).sort((a,b)=>lum(b.hex)-lum(a.hex));
 let j=0;cols=cols.map(c=>c.lock?c:fromHex(out[j++].hex));while(cols.length<5)cols.push(fromHex(out[j++].hex));
 draw();
 const tot=px.length;$('#marks').innerHTML=out.map((o,i)=>o.at?`<span style="left:${(o.at[3]+.5)/W*100}%;top:${(o.at[4]+.5)/H*100}%;background:${o.hex};animation-delay:${i*90}ms" title="${o.hex.toUpperCase()} · ${Math.round(o.n/tot*100)}%"></span>`:'').join('');
 $('#phNote').textContent=`K-means (k=5) on ${tot.toLocaleString()} sampled pixels · dominant ${out.slice().sort((a,b)=>b.n-a.n)[0].hex.toUpperCase()}`;
