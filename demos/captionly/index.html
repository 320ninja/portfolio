<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captionly — Subtitle Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Instrument+Serif:ital@0;1&family=Roboto:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090c;--p:#111216;--p2:#17181e;--p3:#1f2028;--line:#24262e;--line2:#30333d;--text:#ecedf1;--muted:#8b8f9b;--dim:#5b5f6a;--acc:#7c6cff;--acc2:#b4a9ff;--wave:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.mono{font-family:'IBM Plex Mono',monospace}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--p);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.proj{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:4px;border-left:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;min-width:0}
.proj b{color:var(--text);font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.chip{font:500 10.5px 'IBM Plex Mono',monospace;color:var(--muted);border:1px solid var(--line2);padding:2px 7px;border-radius:5px}
.sp{flex:1}
.tools{display:flex;gap:6px}
.btn{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--p2);font-size:12.5px;font-weight:600;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--p3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#8b7dff}
.btn svg{width:15px;height:15px;flex:none}
.app{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr) auto;gap:1px;background:var(--line);height:calc(100vh - 52px);min-height:620px}
.pane{background:var(--p);min-width:0;min-height:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.hd .sp{flex:1}
.hd .count{letter-spacing:0;text-transform:none;font:500 11px 'IBM Plex Mono',monospace;color:var(--dim)}
.pv{background:#0b0b0e}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:14px;position:relative}
.screen{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #23252c,0 30px 60px -30px #000;container-type:size}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.screen.land{aspect-ratio:16/9;height:auto;width:100%}
.screen.land video{object-fit:contain}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}
.safe{position:absolute;inset:6% 7%;border:1px dashed rgba(255,255,255,.18);border-radius:6px;pointer-events:none;opacity:0;transition:opacity .2s}
.screen.guides .safe{opacity:1}
.cap{position:absolute;left:7%;right:7%;display:flex;justify-content:center;pointer-events:none;text-align:center}
.cap.bottom{bottom:9%}.cap.top{top:9%}.cap.middle{top:58%;transform:translateY(-50%)}
.cap .ln{display:inline;line-height:1.28;white-space:pre-wrap;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.1em .38em;border-radius:.2em;animation:capin .16s ease-out}
.cap.box .ln{background:rgba(8,8,10,.78)}
.cap .w{display:inline-block;transition:transform .12s,color .12s,background .12s;border-radius:.18em;padding:0 .06em}
.cap .w.on{transform:scale(1.1)}
.cap .w.done{opacity:1}.cap .w.todo{opacity:.92}
.cap.f-yt{font-family:Roboto,Manrope,sans-serif;font-weight:500}
.cap.f-yt .ln{text-shadow:none}
.cap.f-tt{font-family:Montserrat,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.cap.f-tt .ln{line-height:1.12;-webkit-text-stroke:.09em #000;paint-order:stroke fill;text-shadow:0 .08em .18em rgba(0,0,0,.55)}
.cap.f-tt .w.on{-webkit-text-stroke:.09em #000}
.cap.f-cin{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:.01em}
.cap.f-cin .ln{text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6)}
.cap.f-min{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.02em;text-transform:lowercase}
.cap.f-min .ln{text-shadow:0 2px 10px rgba(0,0,0,.55)}
@keyframes capin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.transport{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--p)}
.play{width:36px;height:36px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none;transition:transform .1s}
.play:active{transform:scale(.93)}
.play svg{width:15px;height:15px}
.ib{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:#c3c6cf;transition:background .15s,color .15s;flex:none}
.ib:hover{background:var(--p3);color:#fff}
.ib.on{color:var(--acc2)}
.ib svg{width:16px;height:16px}
.tc{font-size:12px;color:var(--muted);white-space:nowrap}
.tc b{color:var(--text);font-weight:500}
.items{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:24px 1fr 30px;gap:8px;align-items:start;padding:10px 8px 10px 10px;border-radius:9px;border:1px solid transparent;background:var(--p2);transition:border-color .15s,background .15s;animation:itin .2s ease-out}
@keyframes itin{from{opacity:0;transform:translateY(-4px)}}
.item:hover{border-color:var(--line2)}
.item.live{border-color:rgba(124,108,255,.6);background:#1a1828}
.item.sel{border-color:#fff}
.num{font-size:11px;color:var(--dim);padding-top:2px}
.times{font-size:11px;color:var(--acc2);padding:0;text-align:left;margin-bottom:3px;display:flex;gap:8px}
.times:hover{color:#fff}
.times i{font-style:normal;color:var(--dim)}
.cps{font:500 10px 'IBM Plex Mono',monospace;color:var(--dim);margin-top:3px}
.cps.warn{color:#ffb341}
.item textarea{width:100%;background:transparent;border:0;resize:none;font-size:14px;line-height:1.45;font-weight:600;outline:none;padding:3px 6px;margin-left:-6px;border-radius:6px;overflow:hidden;min-height:24px}
.item textarea:focus{background:#0e0f13;box-shadow:inset 0 0 0 1px var(--line2)}
.del{width:30px;height:30px;border-radius:7px;color:var(--dim);display:grid;place-items:center;transition:color .15s,background .15s}
.del:hover{color:#ff6b7a;background:rgba(255,93,108,.1)}
.del svg{width:15px;height:15px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty .btn{margin-top:12px}
kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.sbody{overflow:auto;padding:12px 14px 70px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pre{position:relative;height:84px;border-radius:9px;overflow:hidden;border:1.5px solid var(--line2);background:#000 center/cover;text-align:center;display:flex;align-items:flex-end;justify-content:center;padding:0 6px 10px;transition:border-color .15s}
.pre::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55))}
.pre.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pre .smp{position:relative;font-size:13px;line-height:1.15}
.pre small{position:absolute;left:7px;top:6px;font:600 9.5px 'IBM Plex Mono',monospace;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px;color:#ddd;letter-spacing:.04em;text-transform:uppercase;z-index:1}
.pre .s-yt{font-family:Roboto,sans-serif;font-weight:500;background:rgba(8,8,10,.8);padding:2px 6px;border-radius:3px;color:#fff}
.pre .s-tt{font-family:Montserrat;font-weight:900;text-transform:uppercase;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;font-size:15px}
.pre .s-tt em{font-style:normal;color:#ffe14d}
.pre .s-cin{font-family:'Instrument Serif';font-style:italic;color:#f6eed2;font-size:16px;text-shadow:0 1px 3px #000}
.pre .s-min{font-weight:800;text-transform:lowercase;color:#fff;letter-spacing:-.02em;font-size:14px}
.group{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.group h4{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.row label{font-size:13px;color:#c9ccd4}
.seg{display:inline-flex;background:#0c0d10;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--line2);color:#fff}
.sw{display:flex;gap:6px}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);transition:transform .1s}
.sw button.on{border-color:#fff;transform:scale(1.12)}
.rng{display:flex;align-items:center;gap:10px}
.rng output{font-size:12px;color:var(--muted);width:26px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:18px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:0}
.tog{width:36px;height:21px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--acc)}.tog.on::after{transform:translateX(15px)}
.tl{grid-column:1/-1;background:var(--p)}
.tlbar{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tlbar .hint{letter-spacing:0;text-transform:none;font-weight:500;font-size:11.5px;color:var(--dim)}
.tlwrap{display:flex}
.theads{width:84px;flex-shrink:0;border-right:1px solid var(--line)}
.theads div{display:flex;align-items:center;gap:6px;padding:0 12px;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.theads svg{width:13px;height:13px}
.track{position:relative;flex:1;height:166px;background:#0c0d10;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden}
.track canvas{position:absolute;inset:0;width:100%;height:100%}
.lane{position:absolute;left:0;right:0;top:30px;height:48px}
.blk{position:absolute;top:0;height:100%;background:linear-gradient(180deg,rgba(124,108,255,.42),rgba(124,108,255,.24));border:1px solid rgba(160,148,255,.7);border-radius:6px;overflow:hidden;cursor:grab;transition:background .15s,box-shadow .15s}
.blk:hover{background:linear-gradient(180deg,rgba(124,108,255,.55),rgba(124,108,255,.32))}
.blk.sel{border-color:#fff;box-shadow:0 0 0 1px #fff,0 6px 20px rgba(124,108,255,.35)}
.blk.live{background:linear-gradient(180deg,rgba(124,108,255,.72),rgba(124,108,255,.45))}
.blk p{font-size:11px;font-weight:600;padding:5px 10px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;pointer-events:none;color:#ece9ff}
.h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.h::after{content:"";position:absolute;top:50%;width:3px;height:16px;border-radius:2px;background:rgba(255,255,255,.75);transform:translateY(-50%)}
.h.l{left:0}.h.l::after{left:3px}.h.r{right:0}.h.r::after{right:3px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff5d6c;transform:translateX(-1px);pointer-events:none;z-index:5}
.ph::before{content:"";position:absolute;top:0;left:50%;width:12px;height:12px;background:#ff5d6c;transform:translate(-50%,-3px) rotate(45deg);border-radius:2px}
.wlab{position:absolute;left:8px;top:86px;font:500 10px 'IBM Plex Mono',monospace;color:rgba(255,255,255,.55);pointer-events:none;z-index:3;background:rgba(12,13,16,.7);padding:1px 5px;border-radius:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#fff;color:#111;padding:8px 10px 8px 16px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:#111;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.toast button:empty{display:none}
.back{position:fixed;right:16px;bottom:16px;background:#fff;color:#111;font-size:12px;padding:8px 14px;border-radius:99px;text-decoration:none;z-index:40;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.45)}
@media (max-width:1100px){.app{grid-template-columns:minmax(280px,340px) minmax(0,1fr) 270px}.presets{grid-template-columns:1fr}}
@media (max-width:900px){.app{display:flex;flex-direction:column;height:auto;min-height:0}.pv{order:1}.tl{order:2}.list{order:3}.stylep{order:4}.stage{height:min(72vh,620px);flex:none}.items{overflow:visible;flex:none}.sbody{overflow:visible}.presets{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.btn .lbl{display:none}.btn{padding:0 9px}.tools{gap:4px}.theads{width:40px}.theads span{display:none}.theads div{justify-content:center;padding:0}.tlbar .hint{display:none}.blk p{display:none}.addlbl{display:none}input[type=range]{width:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#7c6cff"/><rect x="6" y="15" width="10" height="3" rx="1.5" fill="#fff"/><rect x="18" y="15" width="4" height="3" rx="1.5" fill="#fff" opacity=".6"/><rect x="6" y="20" width="16" height="3" rx="1.5" fill="#fff" opacity=".85"/><circle cx="14" cy="9" r="3" fill="#fff" opacity=".5"/></svg>
    <b>Captionly</b>
    <div class="proj"><b id="projName">street-reporter.mp4</b><span class="chip" id="resChip">1080×1920</span><span id="savedLbl">Autosaved</span></div>
  </div>
  <div class="sp"></div>
  <div class="tools">
    <button class="btn" id="impVid" title="Import a video file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg><span class="lbl">Import video</span></button>
    <button class="btn" id="impSrt" title="Import .srt or .vtt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span class="lbl">Import SRT</span></button>
    <button class="btn" id="gen" title="Auto-generate sample captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span class="lbl">Auto-generate</span></button>
    <button class="btn" id="expSrt" title="Download .srt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span class="lbl">.srt</span></button>
    <button class="btn pri" id="expVtt" title="Download .vtt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span class="lbl">Export .vtt</span></button>
    <input type="file" id="fVid" accept="video/*" hidden><input type="file" id="fSrt" accept=".srt,.vtt,text/plain" hidden>
  </div>
</header>
<div class="app">
  <section class="pane pv">
    <div class="stage"><div class="screen" id="screen">
      <video id="vid" playsinline preload="auto" poster="../../media/img/poster-character-street-reporter.jpg"><source src="../../media/video/character-street-reporter.mp4" type="video/mp4"></video>
      <div class="safe"></div>
      <div class="cap bottom" id="cap"></div>
    </div></div>
    <div class="transport">
      <button class="play" id="play" aria-label="Play" title="Play / pause (Space)"><svg id="pico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <div class="tc mono"><b id="tcur">00:00.00</b> / <span id="tdur">00:08.00</span></div>
      <div class="sp"></div>
      <button class="ib" id="mute" title="Mute / unmute (M)" aria-label="Mute"><svg id="mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
      <button class="ib" id="guides" title="Toggle safe-area guides (G)" aria-label="Safe-area guides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button class="btn" id="add" title="Add caption at playhead (Enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="addlbl">Add caption</span></button>
    </div>
  </section>
  <section class="pane list">
    <div class="hd"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M14 15h3M7 11h10"/></svg>Captions<span class="sp"></span><span class="count" id="count"></span></div>
    <div class="items" id="items"></div>
  </section>
  <aside class="pane stylep">
    <div class="hd"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Caption style</div>
    <div class="sbody">
      <div class="presets" id="presets"></div>
      <div class="group"><h4>Text</h4>
        <div class="row"><label for="fs">Size</label><div class="rng"><input type="range" id="fs" min="14" max="64" step="1"><output class="mono" id="fso"></output></div></div>
        <div class="row"><label>Position</label><div class="seg" id="pos"><button data-v="top">Top</button><button data-v="middle">Mid</button><button data-v="bottom">Bottom</button></div></div>
        <div class="row"><label>Colour</label><div class="sw" id="sw"></div></div>
        <div class="row"><label for="box">Background box</label><button class="tog" id="box" aria-label="Toggle background box"></button></div>
      </div>
      <div class="group"><h4>Word highlight</h4>
        <div class="row"><label for="words">Word-by-word</label><button class="tog" id="words" aria-label="Toggle word-by-word highlight"></button></div>
        <div class="row"><label>Highlight</label><div class="sw" id="hw"></div></div>
      </div>
    </div>
  </aside>
  <section class="tl">

let peaks=null;const NP=1600;
async function decodeAudio(buf){$('wlab').textContent='Decoding audio…';peaks=null;drawRuler();
  try{const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const ac=new AC(1,44100,44100);
    const ab=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});

    const g=mx>0?.95/mx:1;for(let i=0;i<pk.length;i++)pk[i]*=g;peaks=pk;peaks.dur=ab.duration;
    $('wlab').textContent=`Audio · ${ab.numberOfChannels===1?'mono':'stereo'} · ${(ab.sampleRate/1000).toFixed(1)} kHz`}
  catch(e){peaks=null;$('wlab').textContent='No audio track found'}
  drawRuler()}

  const t=vid.currentTime,was=!vid.paused;vid.src=URL.createObjectURL(new Blob([buf],{type:'video/mp4'}));

const track=$('track'),lane=$('lane'),ruler=$('ruler'),rx=ruler.getContext('2d');
function drawRuler(){const w=track.clientWidth,h=track.clientHeight,dpr=devicePixelRatio||1;if(!w)return;ruler.width=w*dpr;ruler.height=h*dpr;rx.setTransform(dpr,0,0,dpr,0,0);rx.clearRect(0,0,w,h);

  rx.fillStyle='#111216';rx.fillRect(0,0,w,26);rx.fillStyle='#24262e';rx.fillRect(0,26,w,1);rx.fillRect(0,82,w,1);
  rx.font='500 10px "IBM Plex Mono",monospace';
  for(let i=0;i*minor<=Dd+1e-6;i++){const s=i*minor,x=Math.round(s/Dd*w)+.5,mj=i%Math.round(major/minor)===0;rx.fillStyle=mj?'rgba(255,255,255,.3)':'rgba(255,255,255,.12)';rx.fillRect(x,mj?12:19,1,mj?14:7);
    if(mj&&x<w-36){rx.fillStyle='rgba(255,255,255,.45)';rx.fillText(fmt(s).slice(0,5),x+4,10)}}
  const top=86,hh=h-top-4,mid=top+hh/2;
  if(peaks){const pd=peaks.dur||Dd;for(let x=0;x<w;x++){const s=x/w*Dd;const i=Math.floor(s/pd*NP);if(i<0||i>=NP)continue;const lo=peaks[i*2],hi=peaks[i*2+1];

function blockEl(c){let e=lane.querySelector(`.blk[data-id="${c.id}"]`);if(!e){e=document.createElement('div');e.className='blk';e.dataset.id=c.id;e.innerHTML='<div class="h l"></div><p></p><div class="h r"></div>';lane.appendChild(e)}return e}
function layoutBlocks(){const Dd=dur();const ids=new Set(S.caps.map(c=>String(c.id)));

const items=$('items');
function renderList(){items.innerHTML='';$('count').textContent=S.caps.length+' cue'+(S.caps.length===1?'':'s');
  if(!S.caps.length){items.innerHTML='<div class="empty">No captions yet. Scrub to a moment and press <kbd>Enter</kbd>, or<br><button class="btn" id="emptyGen">Generate sample captions</button></div>';$('emptyGen').onclick=generate;return}
  S.caps.forEach((c,i)=>{const it=document.createElement('div');it.className='item'+(c.id===sel?' sel':'');it.dataset.id=c.id;

$('impVid').onclick=()=>$('fVid').click();
$('fVid').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setPlay(false);vid.removeAttribute('poster');vid.innerHTML='';vid.src=URL.createObjectURL(f);vid.load();
  vid.addEventListener('loadedmetadata',()=>{$('projName').textContent=f.name;$('resChip').textContent=vid.videoWidth+'×'+vid.videoHeight;toast('Video loaded')},{once:true});
  vid.onerror=()=>toast('That video format is not supported here. Try MP4 or WebM.');f.arrayBuffer().then(decodeAudio)};
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='TEXTAREA'||tag==='INPUT')return;
  if(e.key==='Enter'&&tag!=='BUTTON'){e.preventDefault();addCap()}
  else if(e.code==='Space'){e.preventDefault();$('play').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();seek(now()-(e.shiftKey?1:.1))}
  else if(e.key==='ArrowRight'){e.preventDefault();seek(now()+(e.shiftKey?1:.1))}
  else if(e.key==='m'||e.key==='M')$('mute').click();else if(e.key==='g'||e.key==='G')$('guides').click()
  else if((e.key==='Delete'||e.key==='Backspace')&&sel!=null){removeCap(sel);sel=null}});
const T=$('toast');let tt;function toast(m,label='',fn=null){T.querySelector('span').textContent=m;const b=T.querySelector('button');b.textContent=label;b.onclick=()=>{fn&&fn();T.classList.remove('show')};T.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('show'),label?4000:1800)}
function tick(force){$('tcur').textContent=fmt(now());$('ph').style.left=(now()/dur()*100)+'%';renderCap(force)}
function frame(){tick(false);requestAnimationFrame(frame)}
$('tdur').textContent=fmt(dur());
renderList();applyStyle();layoutBlocks();drawRuler();
vid.addEventListener('loadeddata',()=>{if(vid.currentTime<.05)seek(1.3)},{once:true});
requestAnimationFrame(frame);
document.fonts&&document.fonts.ready.then(()=>{drawRuler();applyStyle()});
window.__cap={get S(){return S},seek,get peaks(){return peaks}};
})();
</script>
</body>
</html>
